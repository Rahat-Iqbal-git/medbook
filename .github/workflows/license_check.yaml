name: license_check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/license_check.yaml"
  push:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/license_check.yaml"

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0,Zlib"
      flutter_version: "3.44.x"
      # `pubspec_lock_parse` has no detectable license. `sqlcipher_flutter_libs`
      # is an obsolete, no-op transitive dependency of drift_flutter.
      skip_packages: "pubspec_lock_parse,sqlcipher_flutter_libs"
